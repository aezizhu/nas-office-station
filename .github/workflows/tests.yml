name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-eng tesseract-ocr-osd
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -o addopts= -q
      - run: ruff check .
      - run: bash -n scripts/entrypoint.sh && sh -n scripts/healthcheck.sh
      - name: Check public source boundaries
        run: python scripts/check_public_tree.py
